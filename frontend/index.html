<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kanivet - Kubernetes Navigator</title>
  <script>
    (function() {
      try {
        var cached = localStorage.getItem('kanivet-theme-cache');
        var mode = cached || 'dark';
        if (mode === 'auto') {
          mode = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (mode === 'custom') mode = 'dark';
        document.documentElement.setAttribute('data-theme', mode);
        document.documentElement.style.colorScheme = mode;
        document.documentElement.style.backgroundColor = mode === 'dark' ? '#1e1e20' : '#ffffff';
        window.__KANIVET_THEME__ = mode;
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1e1e20';
        window.__KANIVET_THEME__ = 'dark';
      }
      try {
        var ua = navigator.userAgent || '';
        if (/Electron/.test(ua) && /Macintosh/.test(ua)) {
          document.documentElement.setAttribute('data-chrome', 'inset');
        }
      } catch (e) {}
    })();
    window.addEventListener('error', function(e) {
      if (e.message && e.message.includes('ResizeObserver loop completed with undelivered notifications')) {
        e.stopPropagation();
        e.preventDefault();
        return false;
      }
    }, true);
  </script>
  <style>
    #native-splash{position:fixed;top:0;left:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;z-index:999999;transition:opacity .3s ease;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue','Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    #native-splash.dark{background:#1e1e20}
    #native-splash.light{background:#ffffff}
    #native-splash .content{display:flex;flex-direction:column;align-items:center;gap:22px;animation:fadeIn .5s ease-out}
    #native-splash .k{display:block;width:84px;height:84px;border-radius:20px;filter:drop-shadow(0 12px 28px rgba(77,68,196,0.35));animation:float 3s ease-in-out infinite}
    #native-splash .title{font-size:26px;font-weight:600;margin:0;letter-spacing:-0.4px}
    #native-splash.dark .title{color:#f5f5f7}
    #native-splash.light .title{color:#1d1d1f}
    #native-splash .loader{width:180px;height:4px;border-radius:2px;overflow:hidden}
    #native-splash.dark .loader{background:rgba(120,120,128,0.26)}
    #native-splash.light .loader{background:rgba(120,120,128,0.12)}
    #native-splash .bar{width:40%;height:100%;border-radius:2px;animation:loading 1.2s ease-in-out infinite}
    #native-splash.dark .bar{background:#0a84ff}
    #native-splash.light .bar{background:#007aff}
    #native-splash .msg{font-size:12.5px;margin:0;min-height:18px;animation:pulse 2.5s ease-in-out infinite}
    #native-splash.dark .msg{color:rgba(235,235,245,0.62)}
    #native-splash.light .msg{color:rgba(60,60,67,0.62)}
    @media (prefers-reduced-motion:reduce){#native-splash .k,#native-splash .msg{animation:none}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    @keyframes loading{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
    @keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
    #native-splash.hiding{opacity:0;pointer-events:none}
  </style>
</head>
<body style="margin:0;background:inherit">
  <div id="native-splash" class="dark">
    <div class="content">
      <svg class="k" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="splash-k-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b8dff"/><stop offset="1" stop-color="#4d44c4"/></linearGradient></defs><rect width="512" height="512" rx="114" fill="url(#splash-k-bg)"/><path d="M179 132V380M181 256L321 138M227 217L333 380" fill="none" stroke="#ffffff" stroke-width="68" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <h1 class="title">Kanivet</h1>
      <div class="loader"><div class="bar"></div></div>
      <p class="msg">Kubernefying the system...</p>
    </div>
  </div>
  <script>
    (function(){
      var msgs=['Kubernefying the system...','Wrangling pods into formation...','Spinning up the control plane...','Consulting the etcd oracle...','Teaching containers to behave...','Negotiating with the scheduler...','Summoning the cluster spirits...','Deploying good vibes...','Convincing nodes to cooperate...','Orchestrating magnificence...','Asking kubectl nicely...','Herding microservices...','Reconciling the universe...','Waiting for pods to pod...','Patching things together...','Rolling out the red carpet...','Scaling hopes and dreams...','Checking if it works on my cluster...','Draining bad vibes from nodes...','Applying YAML with confidence...'];
      var splash=document.getElementById('native-splash');
      var msgEl=splash.querySelector('.msg');
      var theme=window.__KANIVET_THEME__||'dark';
      splash.className=theme;
      var idx=Math.floor(Math.random()*msgs.length);
      msgEl.textContent=msgs[idx];
      setInterval(function(){
        var next=Math.floor(Math.random()*msgs.length);
        while(next===idx&&msgs.length>1)next=Math.floor(Math.random()*msgs.length);
        idx=next;
        msgEl.textContent=msgs[idx];
      },2500);
    })();
  </script>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>
</html>
