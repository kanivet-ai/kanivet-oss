name: Release channels

on:
  push:
    branches: [main]

permissions:
  contents: read

# Keep release-please updates and publication in order; never cancel a stable build.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      pr: ${{ steps.plan.outputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Select stable release or pending release candidate
        id: plan
        uses: actions/github-script@v7
        env:
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const plan = require('./scripts/release-plan.cjs');
            await plan({ github, context, core });

  release-candidate:
    needs: prepare
    if: needs.prepare.outputs.channel == 'rc'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      channel: rc
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
      pr: ${{ needs.prepare.outputs.pr }}
    secrets: inherit

  stable:
    needs: prepare
    if: needs.prepare.outputs.channel == 'stable'
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: write
      pull-requests: write
    with:
      channel: stable
      version: ${{ needs.prepare.outputs.version }}
      sha: ${{ needs.prepare.outputs.sha }}
    secrets: inherit
